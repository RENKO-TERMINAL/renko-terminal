<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renko Terminal</title><style>body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:15px}h1{text-align:center}h1 span{color:#22c55e}.box{text-align:center;background:#1e293b;padding:12px;border-radius:10px;margin:10px 0}table{width:100%;border-collapse:collapse;background:white;color:black;border-radius:10px;overflow:hidden}th{background:#0f172a;color:white;padding:10px}td{padding:9px;text-align:center;border-bottom:1px solid #ddd}.BUY{background:#dcfce7;color:#166534;font-weight:bold}.SELL{background:#fee2e2;color:#991b1b;font-weight:bold}input{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:none}</style></head><body><h1>🟩 RENKO <span>TERMINAL</span> 🟥</h1><div class="box" id="summary">Loading...</div><input id="search" placeholder="Search Stock... e.g. RELIANCE" onkeyup="filter()"><table><thead><tr><th>Stock</th><th>Price</th><th>Signal</th><th>Brick</th><th>Brick Size</th></tr></thead><tbody id="rows"></tbody></table><script>let all=[];fetch('signals.csv').then(r=>r.text()).then(t=>{let lines=t.trim().split('\n').slice(1);all=lines.map(l=>l.split(','));show(all);let b=all.filter(r=>r[2]=='BUY').length,s=all.filter(r=>r[2]=='SELL').length;document.getElementById('summary').innerHTML=`Total: ${all.length} | 🟢 BUY: ${b} | 🔴 SELL: ${s}`});function show(d){document.getElementById('rows').innerHTML=d.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="${r[2]}">${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}function filter(){let q=document.getElementById('search').value.toUpperCase();show(all.filter(r=>r[0].includes(q)))}</script></body></html>
